<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Iniciar sesión | Clínica Odontológica</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">
        <a class="navbar-brand fw-bold" href="/index.html">ClínicaOdontológica</a>
    </div>
</nav>

<!-- CONTENIDO PRINCIPAL -->
<div class="container d-flex justify-content-center align-items-center" style="min-height: 80vh;">
    <div class="card shadow-lg p-4" style="max-width: 420px; width: 100%;">
        <h3 class="text-center mb-4 fw-bold text-dark">Iniciar sesión</h3>

        <!-- Mensajes de error y logout -->
        <div id="alert-container">
            <div class="alert alert-success text-center py-2 mb-3 d-none" id="logout-msg">Has cerrado sesión correctamente.</div>
            <div class="alert alert-danger text-center py-2 mb-3 d-none" id="error-msg">Usuario o contraseña incorrectos.</div>
        </div>

        <!-- FORMULARIO -->
        <form method="post" action="/login">
            <div class="mb-3">
                <label for="username" class="form-label fw-semibold">Usuario</label>
                <input type="text" id="username" name="username" class="form-control" placeholder="Ingrese su usuario" required>
            </div>
            <div class="mb-3">
                <label for="password" class="form-label fw-semibold">Contraseña</label>
                <input type="password" id="password" name="password" class="form-control" placeholder="Ingrese su contraseña" required>
            </div>
            <button type="submit" class="btn btn-dark w-100">Ingresar</button>
        </form>
    </div>
</div>

<!-- FOOTER -->
<footer class="text-center text-muted mt-5 mb-3">
    <small>© 2025 Clínica Odontológica — Proyecto Agustin Lopez - UP</small>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<!-- Mostrar mensajes de error/logout -->
<script>
    const params = new URLSearchParams(window.location.search);
    if (params.has('error')) document.getElementById('error-msg').classList.remove('d-none');
    if (params.has('logout')) document.getElementById('logout-msg').classList.remove('d-none');
</script>
</body>
</html>
