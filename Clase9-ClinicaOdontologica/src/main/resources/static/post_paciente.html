            <ul class="navbar-nav ms-auto">
                <li class="nav-item dropdown">
                    <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown">Gestión Pacientes</a>
                    <ul class="dropdown-menu">
                        <li><a class="dropdown-item" href="get_pacientes.html">Listar</a></li>
                        <li><a class="dropdown-item" href="post_paciente.html">Registrar</a></li>

<div class="container mt-4">
    <h2>Registrar Paciente</h2>
    <form id="form_paciente" class="mt-3">
        <!--PACIENTE -->
        <div class="mb-3">
            <label for="nombre" class="form-label">Nombre</label>
            <input type="text" class="form-control" id="nombre" required>
        </div>
        <div class="mb-3">
            <label for="apellido" class="form-label">Apellido</label>
            <input type="text" class="form-control" id="apellido" required>
        </div>
        <div class="mb-3">
            <label for="numero" class="form-label">Número de contacto</label>
            <input type="tel" class="form-control" id="numero" placeholder="Ej: 1122334455" required>
        </div>
        <div class="mb-3">
            <label for="fecha" class="form-label">Fecha de ingreso</label>
            <input type="date" class="form-control" id="fecha" required>
        </div>
        <div class="mb-3">
            <label for="email" class="form-label">Email</label>
            <input type="email" class="form-control" id="email" placeholder="ejemplo@correo.com" required>
        </div>

        <!--DOMICILIO -->
        <h5 class="mt-4">Domicilio</h5>
        <div class="mb-3">
            <label for="calle" class="form-label">Calle</label>
            <input type="text" class="form-control" id="calle" required>
        </div>
        <div class="mb-3">
            <label for="numDomicilio" class="form-label">Número</label>
            <input type="number" class="form-control" id="numDomicilio" required>
        </div>
        <div class="mb-3">
            <label for="localidad" class="form-label">Localidad</label>
            <input type="text" class="form-control" id="localidad" required>
        </div>
        <div class="mb-3">
            <label for="provincia" class="form-label">Provincia</label>
            <input type="text" class="form-control" id="provincia" required>
        </div>

        <button type="submit" class="btn btn-primary">Registrar</button>
    </form>

    <div id="response" class="mt-3" style="display:none;"></div>
</div>

<!-- 🔹 Bootstrap + Scripts -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/post_paciente.js"></script>
</body>
</html>
