        <a class="navbar-brand fw-bold" href="/index.html">ClínicaOdontológica</a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">

                <!--GESTIÓN PACIENTES -->
                <li class="nav-item dropdown">
                    <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown">Gestión Pacientes</a>
                    <ul class="dropdown-menu">

                </li>

                <!--GESTIÓN ODONTÓLOGOS -->
                <li class="nav-item dropdown">
                    <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown">Gestión Odontólogos</a>
                    <ul class="dropdown-menu">
                        <li><a class="dropdown-item" href="/post_odontologo.html">Registrar</a></li>
                        <li><a class="dropdown-item" href="/get_odontologos.html">Listar</a></li>

<!--CONTENIDO PRINCIPAL -->
<div class="container mt-4">
    <h2 class="mb-4">Turnos</h2>
    <div class="table-responsive">
        <table id="turnoTable" class="table table-hover table-bordered align-middle bg-white">
            <thead class="table-dark">
            <tr>
            <th>ID</th>
            <th>Fecha</th>
            <th>ID Paciente</th>
            <th>ID Odontologo</th>
        </tr>
        </thead>
        <tbody id="turnoTableBody"></tbody>
        </table>
    </div>

    <hr>

    <!-- FORMULARIO DE EDICIÓN -->
    <div id="div_turno_updating" class="col-md-6 mx-auto bg-light border rounded p-3 shadow-sm" style="display: none;">
        <h5 class="mb-3">Listar Turnos</h5>
        <form id="update_turno_form">
            <div class="mb-2">
                <label>ID:</label>
                <input type="text" class="form-control" id="turno_id" readonly>
            </div>
            <div class="mb-2">
                <label>Fecha:</label>
                <input type="date" class="form-control" id="fecha" required>
            </div>
            <div class="mb-2">
                <label>ID Paciente:</label>
                <input type="text" class="form-control" id="pacienteId" required>
            </div>
            <div class="mb-2">
                <label>ID Odontologo:</label>
                <input type="text" class="form-control" id="odontologoId" required>
            </div>
        </form>
    </div>

</div>

<!-- 🔹 Bootstrap + Scripts -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
