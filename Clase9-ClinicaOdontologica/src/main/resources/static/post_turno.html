<div class="container mt-4">

    <form id="form_turno" class="mt-3">
        <!--TURNO -->
        <div class="mb-3">
            <label for="paciente" class="form-label">ID Paciente</label>
            <input type="text" class="form-control" id="paciente" required>
        </div>

            <label for="odontologo" class="form-label">ID Odontologo</label>

        </div>
        <div class="mb-3">
            <label for="fecha" class="form-label">Fecha Turno</label>
            <input type="date" class="form-control" id="fecha" required>
        </div>



        <button type="submit" class="btn btn-primary">Registrar</button>
    </form>
